# dsh-zvec-knowledge bundle patch — mounts the knowledge-base plugin into the
# host composition of a dsh profile. The plugin owns one zvec-backed store of
# knowledge collections and registers the `dsh_kb_search` retrieval tool into
# the shared `tools` registry, so a session can drive it through natural
# language.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). That command pnpm-installs the package into the profile and reconciles
# it into the profile's `dsh.profile.bundles` layer list.
#
# Every value below is a deployment-varying choice, so it lives here rather
# than as a constant in the plugin source (harness convention: no hardcoded
# tunables in plugins).
- insert:
    - id: zvec-knowledge
      # Node-resolvable package name — must stay in sync with package.json
      # `name`. Quoted because `@`/`:` are reserved indicators in YAML plain
      # scalars.
      name: 'dsh-zvec-knowledge'
      config:
        # Storage root, resolved against the session workspace so two
        # workspaces never share an index. Relative paths are the norm;
        # an absolute path opts out of workspace isolation deliberately.
        stateDir: .dsh-kb-zvec
        # Default chunking strategy (design spec §5.5, §10.1).
        chunking:
          mode: heading
          chunkTokens: 1024
          overlapTokens: 128
          minChunkTokens: 64
        # Default retrieval knobs (design spec §5.6, §9.2, §10.1).
        retrieval:
          topk: 8
          # Below this normalized score a hit never reaches RAG generation
          # (design spec §6.4 兜底文案).
          minScore: 0.55
        # Storage quota (design spec §8.2 受限态). `bytes: null` means unlimited,
        # which is the default: the spec leaves the figure to the business side, so
        # a deployment that has one states it here and the interface then names the
        # real limit instead of a plausible-looking constant.
        quota:
          bytes: null
          # Fraction at which the interface reports the store as near its limit.
          # Separate from the limit because a user refused at 100% has no chance to
          # act; one warned at 90% does.
          warnAt: 0.9
        # Embedding endpoint (OpenAI-compatible /v1/embeddings). OMIT THIS BLOCK
        # entirely for a deployment with no model: retrieval then reports that
        # clearly instead of failing at the first build.
        #
        # `dimension` must match what the model returns — a collection's schema is
        # created at this width and the engine rejects vectors of another size.
        # The deployed qwen3-embedding:4b returns 2560; the 1024 default is the
        # design spec's illustrative figure and is wrong for that model.
        #
        # `apiKeyEnv` is a variable NAME, never the key: --dump-config prints this
        # file, so a literal key here would be written to logs. Leave it blank for
        # a local endpoint that needs no authentication.
        embedding:
          baseUrl: http://127.0.0.1:11434/v1
          model: qwen3-embedding:4b
          apiKeyEnv: ''
          dimension: 2560
          batchSize: 64
